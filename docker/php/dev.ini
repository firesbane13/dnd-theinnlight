; Local container only. display_errors is for PHP startup failures, not a production setting.
; Recheck PHP files on every request so a save on the host is the next page load.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
memory_limit = 256M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 60
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
